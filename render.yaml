services:
  - type: web
    name: haqms-backend
    runtime: node
    root: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && node prisma/seed.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: haqms-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://haqmsui.vercel.app

databases:
  - name: haqms-db
    databaseName: haqms
    user: haqms_user
    plan: free
